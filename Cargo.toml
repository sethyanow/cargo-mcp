[package]
name = "cargo-stevedore"
version = "0.2.0"
authors = ["Seth <claude.5vpzx@simplelogin.com>"]
edition = "2024"
description = "MCP server exposing cargo commands as tools for AI agents"
readme = "README.md"
repository = "https://github.com/sethyanow/cargo-mcp"
documentation = "https://docs.rs/cargo-stevedore"
license = "MIT OR Apache-2.0"
keywords = ["mcp", "cargo", "rust", "ai", "stevedore"]
categories = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fieldwork = "0.4.6"
log = "0.4.27"
mcplease = "0.2.2"
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1.1"

# [patch.crates-io]
# mcplease = { path = "../mcplease" }
